# olua CI
#
# ## 覆盖范围（刻意如此，不是漏跑）
#   ✓ 服务端：编译 + 六套 e2e（248 / 77 / 283 / 120 / 87 / 28 条断言，共 843；真实起服务、真实 HTTP 打）
#   ✓ 管理端：类型检查 + 构建
#   ✓ 跨端审计：8 个（接口生成物一致性 / 地址唯一来源 / 战斗规则快照 / 战斗算法 parity / 配置外泄 / 中英文档一致 / 点击穿透 / 部署接线）
#
#   ✓ 客户端类型检查（client-check）：**已进 CI**。Cocos 类型声明 vendoring 进
#     client/types/engine/（相对路径 + 真实引擎 cc.d.ts），CI 无需 Cocos 编辑器，
#     由 install-ci 装好的 client/node_modules/.bin/tsc 跑（见 #24 路径 B）。
#   ✗ 客户端单测（client-test）：**仍不在 CI 覆盖范围内**——25 套里有 10 套断言
#     assets/resources/ 下的真实素材（图集/帧序列/怪物帧 .meta），素材体积大、有意不入库
#     （见 .gitignore）。干净 clone 上这些断言不可能成立。客户端单测是「本地专属」：
#     本机用 Cocos Creator 打开 client/ 后跑 `make test`。
#
# ## 门禁清单只此一处
#   这个 workflow 只调 `make ci`，顺序与内容全写在 Makefile 里 —— 本机跑同一条命令即可复现 CI。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁（服务端 + 管理端 + 跨端审计）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node（服务端 engines 要求 >= 22.5.0，node:sqlite）
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            admin/package-lock.json
            client/package-lock.json

      - name: 打印工具链与工程状态
        run: make info

      - name: 跑门禁
        # install-ci 已把 tsc 装进 client/node_modules；client-check 里 `cd client` 后
        # 相对路径 node_modules/.bin/tsc 正好解析到它，CI 无需 Cocos 编辑器。
        run: make ci TSC=node_modules/.bin/tsc
