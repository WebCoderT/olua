# olua CI
#
# ## 覆盖范围（刻意如此，不是漏跑）
#   ✓ 服务端：编译 + 四套 e2e（187 / 77 / 279 / 25 条断言，真实起服务、真实 HTTP 打）
#   ✓ 管理端：类型检查 + 构建
#   ✓ 跨端审计：5 个（接口生成物一致性 / 地址唯一来源 / 配置外泄 / 点击穿透 / 部署接线）
#
#   ✗ 客户端：**不在 CI 覆盖范围内**，两条独立的原因，都不是「忘了配」：
#     1. `make client-check`（全工程 tsc）要 `client/temp/declarations/cc.d.ts` ——
#        那是 Cocos Creator 编辑器产物，内容是指向本机引擎的绝对路径，而 client/temp/ 在 .gitignore 里；
#     2. `make client-test` 的 24 套单测里有 10 套直接断言 `assets/resources/` 下的真实素材
#        （图集/帧序列/怪物帧 .meta），而素材体积大、**有意不入库**（见 .gitignore）。
#        干净 clone 上这些断言不可能成立。
#   → 客户端门禁是「本地专属」：本机用 Cocos Creator 打开 client/ 后跑 `make check` / `make test`。
#
# ## 门禁清单只此一处
#   这个 workflow 只调 `make ci`，顺序与内容全写在 Makefile 里 —— 本机跑同一条命令即可复现 CI。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 门禁（服务端 + 管理端 + 跨端审计）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node（服务端 engines 要求 >= 22.5.0，node:sqlite）
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            admin/package-lock.json

      - name: 打印工具链与工程状态
        run: make info

      - name: 跑门禁
        run: make ci
