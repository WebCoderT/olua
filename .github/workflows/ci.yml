# olua CI
#
# ## 什么时候跑（#631 收敛过，这是刻意的最小集合）
#   ✓ PR：跑一次全套（静态半边 + 4 个 e2e 分片并行）
#   ✗ 合并到 master：**不再跑** —— PR 的 CI 跑的是 `refs/pull/N/merge`，即
#     「master + 本次改动」；squash 之后 master 的树与它相同，再跑一遍测不到新东西。
#     （直接 push master 不受门禁保护，所以别那么干；需要时用 workflow_dispatch。）
#   ✗ 纯文档 / 记忆 / 设计稿：`paths-ignore` 直接不触发（改 .md 跑不动任何代码）
#   ✓ 手动：workflow_dispatch（想重跑全量时用）
#
# ## 跑什么
#   static  = `make ci-static`：客户端 tsc + 管理端构建 + 15 项跨端审计 + 服务端编译
#   e2e × 4 = `make server-e2e-shard`：套件清单**派生自 server/package.json**
#             （29 个 test:e2e* 脚本），按 index % N 切片 —— 新增 e2e 脚本自动进 CI，
#             不需要来改这个文件。以前 Makefile 里手写的清单漏了 3 套
#             （admin-mail / mail-expiry / ui-effect），谁都没发现。
#
# ## 不跑什么（刻意，不是漏跑）
#   ✗ 客户端单测（client-test）：若干套断言 assets/resources/ 下的真实素材
#     （图集/帧序列/怪物帧 .meta），素材体积大、有意不入库（见 .gitignore），
#     干净 clone 上这些断言不可能成立。客户端单测是「本地专属」。
#   ✓ 客户端类型检查（client-check）：Cocos 类型声明 vendoring 进 client/types/engine/
#     （相对路径 + 真实引擎 cc.d.ts），CI 无需 Cocos 编辑器。
#
# ## 门禁清单仍在 Makefile
#   这个 workflow 只调三个 make 目标（ci-static / server-install-ci / server-e2e-shard），
#   顺序与内容写在 Makefile —— 本机 `make ci` 跑的是同一套（串行版），不会漂。

name: CI

on:
  pull_request:
    # 只有文档变动的 PR 不必跑门禁：这些路径不可能让代码变坏
    paths-ignore:
      - "**/*.md"
      - ".workbuddy/**"
      - "design/**"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

# 同一个 PR 连续 push 时取消上一轮（新提交没必要等旧提交跑完）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 静态（类型检查 / 审计 / 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node（服务端 engines 要求 >= 22.5.0，node:sqlite）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            admin/package-lock.json
            client/package-lock.json

      - name: 跑静态半边
        # TSC：install-ci 已把 tsc 装进 client/node_modules，client-check 里 `cd client`
        # 后相对路径正好解析到它，CI 无需 Cocos 编辑器。
        run: make ci-static TSC=node_modules/.bin/tsc

  e2e:
    name: e2e 分片 ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false # 一片红不影响其它片跑完 —— 一次看到全部失败
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Node（服务端 engines 要求 >= 22.5.0，node:sqlite）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            admin/package-lock.json
            client/package-lock.json

      - name: 装服务端依赖
        run: make server-install-ci

      - name: 编译服务端（e2e 跑的是 dist/ 产物）
        run: make server-build

      - name: 跑本分片
        # N 取 matrix 的长度，不写死 —— 改分片数只改上面那个数组
        run: make server-e2e-shard I=${{ matrix.shard }} N=${{ strategy.job-total }}
