# ==============================================================================
#  管理端托管 + 接口同源反代
#
#  为什么要把 /api 反代过去：管理端与接口**同源**之后，浏览器根本不发跨域请求，
#  服务端就不必配 CORS_ORIGINS —— 少一处会配错、而且配错了很难被发现的东西。
#
#  两处与 docker-compose.yml 耦合，改任何一边都要两边一起改
#  （tools/audit-deploy.cjs 会替你把它们对上）：
#    1. `server` 是 compose 里的服务名（下面用变量 + Docker 内置 DNS 解析，见注释）
#    2. `/api/` 要和服务端的 API_PREFIX 一致
# ==============================================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 带内容哈希的静态资源可以长缓存
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # 单页应用：/accounts/xxx 这类前端路由直接刷新时也要能落到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html 不缓存：否则发版后浏览器还在用旧页面（它引用的资源已经不存在了）
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /api/ {
    # 用「变量 + Docker 内置 DNS」而不是把上游写成字面量：写死的话，server 容器还没就绪时
    # nginx 会因为 `host not found in upstream` **直接启动失败**（depends_on 只保证启动顺序，
    # 不保证名字已经可解析）。用变量后解析推迟到请求时，起停顺序就不敏感了。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $olua_api http://server:3100;
    proxy_pass $olua_api;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 服务端要能看到真实来源 IP（登录限流按 IP 计数），所以这两个头必须有，
    # 且服务端要开 TRUST_PROXY（见 docker-compose.yml）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
