# ==============================================================================
#  olua 一键起（服务端 + 管理端）
#
#  前置（**必须**，compose 用它把密钥与注册码交给服务端）：
#      cp server/.env.example server/.env
#      # 然后把 JWT_SECRET 换成随机长串、ADMIN_REGISTER_CODE 换成你自己的
#
#  起：docker compose up -d --build      # 或 make docker-up
#  看：docker compose logs -f server
#  收：docker compose down               # 数据在具名卷里，不会丢
#
#  拓扑：浏览器 → admin(nginx :80) → /api 反代 → server(:3100)
#        浏览器 → game(nginx :8080) → /api 反代 → server(:3100)
#                                   └→ /api/realtime* 反代 → server-realtime(:3101，WS)
#        管理端与接口**同源**，所以不需要 CORS；而反代之后服务端必须相信代理给的来源 IP。
#        这两件事都由本文件的拓扑决定（见下面的 environment），不靠每个 .env 各写一遍。
# ==============================================================================

name: olua

services:
  server:
    build: ./server
    image: olua-server:local
    restart: unless-stopped
    # 密钥 / 注册码 / 限流阈值都在这份文件里；没有它 compose 会直接报错（这是故意的：
    # 缺配置时宁可起不来，也不要用内置默认密钥悄悄跑起来）
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      # 容器内的数据文件路径 —— 必须落在下面挂的卷里
      DB_PATH: /app/data/olua.db
      # 出厂配置快照住在**镜像里**（Dockerfile 的 COPY data/config-sync.sql），
      # 不在 /app/data 下：那个目录被具名卷挂载盖住，卷里不会有这个文件。
      # 空库首次启动时靠它自举出全部配置表（种子只对空库生效，不动已有运营数据）。
      CONFIG_SNAPSHOT_PATH: /app/config-sync.sql
      # nginx 转发了 X-Forwarded-For，所以必须信任它：否则 req.ip 全是 nginx 容器的地址，
      # 登录限流的 IP 维度会把所有人当成同一个人一起锁死
      TRUST_PROXY: "true"
      # 管理端与接口同源 → 默认不放行任何跨域来源（空值 = 不配置 CORS）。
      # 要给别的域名放行：OLUA_CORS_ORIGINS=https://admin.example.com docker compose up -d
      CORS_ORIGINS: ${OLUA_CORS_ORIGINS:-}
    volumes:
      - olua-data:/app/data
    # 接口**不映射到宿主机**：管理端走下面的 compose 内网反代已经够用，
    # 对外多开一个 3100 只是把签名接口与 Swagger 一并暴露出去，没有收益。
    # 本地要用 Swagger 调试，把下面四行的注释去掉（或临时 docker run -p 3100:3100）：
    # ports:
    #   - "${OLUA_SERVER_PORT:-3100}:3100"

  # 实时进程（#37 拆进程）：同一个镜像、不同的入口 —— WS 实时通道 + 取票 + 世界权威 +
  # 伤害结算都在这里，与存档进程共享同一个 SQLite 文件（WAL + busy_timeout，各写各的表）。
  # **不映射到宿主机**：game 容器把 /api/realtime* 按路径反代到这里（含 WS upgrade 头），
  # 对外仍只有一个 8080。
  server-realtime:
    build: ./server
    image: olua-server:local
    restart: unless-stopped
    depends_on:
      - server
    # 与存档进程同一份 .env（密钥 / 数据库路径一致）；入口由 command 指到实时进程
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      DB_PATH: /app/data/olua.db
      CONFIG_SNAPSHOT_PATH: /app/config-sync.sql
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${OLUA_CORS_ORIGINS:-}
      # 健康检查（见下面的 healthcheck 覆盖）打这个端口；实时进程监听 REALTIME_PORT
      REALTIME_PORT: "3101"
    volumes:
      # 与 server **同一个具名卷**：两进程读写同一个库文件（WAL 承接并发）
      - olua-data:/app/data
    command: ["node", "dist/main.realtime.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  admin:
    build:
      # context 是**仓库根**而不是 ./admin：管理端要 import 服务端的枚举常量
      # （server/src/common/constants/game-enums），只给 admin/ 会让那条相对路径落到上下文外。
      # 根目录 .dockerignore 已把 client/ 等大目录挡在外面（见 admin/Dockerfile 头部说明）。
      context: .
      dockerfile: admin/Dockerfile
      args:
        # 构建期决定（Vite 会内联）；/api 走下面的同源反代
        VITE_API_BASE_URL: /api
    image: olua-admin:local
    restart: unless-stopped
    depends_on:
      - server
    environment:
      # 三站域名（admin/nginx.conf.template 的 envsubst 用）：官网 / 管理端 / 游戏。
      # 默认值来自 compose 目录下的 `.env`（deploy.sh 会生成上传）；这里再兜一层底，
      # 本地没有 .env 也能起。**换域名改 .env 再 `up -d admin`，不用重建镜像**。
      OLUA_SITE_DOMAINS: ${OLUA_SITE_DOMAINS:-yimw.cn www.yimw.cn}
      OLUA_ADMIN_DOMAIN: ${OLUA_ADMIN_DOMAIN:-admin.yimw.cn}
      OLUA_GAME_DOMAIN: ${OLUA_GAME_DOMAIN:-game.yimw.cn}
    ports:
      # 对外只开 80：官网 / 管理端 / 游戏都从这里按 server_name 分流（**不上 HTTPS**，见 docs/deploy.md）
      - "${OLUA_ADMIN_PORT:-80}:80"

  # 游戏客户端（Web 端）：静态托管 Cocos 构建产物，并把 /api 同源反代到服务端。
  # **独立端口**而不是塞进上面的 80：Cocos 产物的资源路径相对根目录，放子路径会大面积 404。
  # 产物由 olua-deploy 技能的 deploy.sh --game 从本机 rsync 上来（素材体量大，见 docs/deploy.md）。
  game:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
      - server-realtime
    volumes:
      # 只读：容器不需要写任何东西（游戏没有服务端渲染、也没有上传产物到这里的场景）
      - ./game:/usr/share/nginx/html:ro
      - ./deploy/nginx-game.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 对外用独立端口 8080：与管理端互不干扰，改端口用 OLUA_GAME_PORT
      - "${OLUA_GAME_PORT:-8080}:80"

  # 官网（website/ 纯静态站）：不映射宿主机端口，走 admin(:80) 的 server_name 分流
  # 整站反代进来（yimw.cn / www）。产物随仓库走（deploy.sh 的 git archive 会带上）。
  # 管理端反代时已带 Host 头，这份 nginx 不需要感知外部域名。
  website:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro

volumes:
  # 具名卷：`docker compose down` 不会删它，只有 `down -v` 才会
  olua-data:
