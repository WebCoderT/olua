<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11 · 任务 · Olua UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<style>
/* ── 任务 600×560：两页签 + 列表（行高 64） ── */
.quest{position:relative;width:600px;height:540px}
.qlist{display:flex;flex-direction:column;gap:8px;height:396px;overflow:auto;padding-right:4px}
.qrow2{display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border-radius:var(--r-2);
  border:var(--bw-1) solid var(--line-1);background:rgba(0,0,0,.24)}
.qrow2.ready{border-color:rgba(111,191,142,.45);background:linear-gradient(90deg,rgba(111,191,142,.12),transparent)}
.qrow2 .mid{flex:1;min-width:0}
.qrow2 .t{font-size:14px;color:var(--gold-5);letter-spacing:.04em}
.qrow2 .s{font-size:11.5px;color:var(--text-3);margin-top:4px}
.qrow2 .s.ok{color:var(--jade)}
.qrow2 .s b{font-family:var(--font-num);color:var(--text-2);font-weight:400}
.qrow2 .reward{flex:0 0 auto;text-align:right;font-family:var(--font-num);font-size:10px;color:var(--text-4);line-height:1.7}
</style>
</head>
<body>
<div class="stage"><div class="stage-inner">
  <div class="stage-bg stage-bg--blur"><img src="../assets/hero-bg.jpg"></div>
  <div class="stage-scrim"></div>

  <div class="layer layer--dialog center">
    <div class="panel panel--rivet quest">
      <div class="panel-head">
        <span class="panel-eyebrow">QUEST</span>
        <h2 class="panel-title">任务</h2>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="panel-body">

        <div class="tabs" style="margin-bottom:12px">
          <button class="tab is-on">进行中<span class="badge">3</span></button>
          <button class="tab">可 接<span class="badge">5</span></button>
        </div>

        <div class="qlist scroll">
          <div class="qrow2 ready">
            <div class="mid">
              <div class="t">采集荒漠血草</div>
              <div class="s ok">可交付 · 奖励已就绪</div>
            </div>
            <span class="reward">1,200 经验<br>80 绑元</span>
            <button class="btn btn--xs btn--gold">交 付</button>
          </div>

          <div class="qrow2">
            <div class="mid">
              <div class="t">剿灭沙盗匪首</div>
              <div class="s">进度 <b>2 / 3</b> · 击杀沙盗匪首</div>
            </div>
            <span class="reward">2,400 经验<br>150 绑元</span>
            <span class="badge badge--muted">进行中</span>
          </div>

          <div class="qrow2">
            <div class="mid">
              <div class="t">拜访铁匠铺老板</div>
              <div class="s">进度 <b>0 / 1</b> · 与铁匠对话</div>
            </div>
            <span class="reward">600 经验</span>
            <span class="badge badge--muted">进行中</span>
          </div>

          <div class="qrow2">
            <div class="mid">
              <div class="t">清理废弃哨塔</div>
              <div class="s">目标 <b>沙盗哨兵 ×8</b> · 击杀</div>
            </div>
            <span class="reward">1,800 经验<br>60 绑元</span>
            <button class="btn btn--xs btn--ghost">接 取</button>
          </div>

          <div class="qrow2">
            <div class="mid">
              <div class="t">矿洞的求救信</div>
              <div class="s">目标 <b>被困矿工 ×1</b> · 对话</div>
            </div>
            <span class="reward">900 经验</span>
            <button class="btn btn--xs btn--ghost">接 取</button>
          </div>

          <div class="qrow2">
            <div class="mid">
              <div class="t">沙城的粮食危机</div>
              <div class="s">目标 <b>袋装粟米 ×5</b> · 采集</div>
            </div>
            <span class="reward">1,500 经验<br>40 绑元</span>
            <button class="btn btn--xs btn--ghost">接 取</button>
          </div>
        </div>

      </div>
      <div class="panel-foot"><span>左侧任务追踪整块可点打开本窗</span><span>交付奖励由服务端结算</span></div>
    </div>
  </div>

</div></div>
<script src="../stage.js"></script>
</body>
</html>
