<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>17 · 成长线（军衔 / 称号 / 战魂） · Olua UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<style>
/* ── 成长线 880×540：三栏同构（军衔 / 称号 / 战魂 共用这一版式） ── */
.grow{position:relative;width:880px;height:540px}
.gbody{display:grid;grid-template-columns:216px 1fr 224px;gap:var(--col-gap);height:392px;padding:0 18px}
.glist{display:flex;flex-direction:column;gap:6px;overflow:auto;padding-right:4px}
.gitem{height:46px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:var(--r-2);
  border:var(--bw-1) solid var(--line-1);background:rgba(0,0,0,.24);cursor:pointer;transition:.2s}
.gitem:hover{border-color:var(--line-3)}
.gitem.on{border-color:var(--gold-3);background:linear-gradient(90deg,rgba(194,146,69,.15),transparent)}
.gitem .step{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  font-family:var(--font-num);font-size:11px;color:var(--text-3);border:1px solid var(--line-2)}
.gitem.on .step{background:var(--gold-3);color:var(--text-on-gold);border-color:var(--gold-4)}
.gitem .nm{font-size:12.5px;color:var(--text-1)}
.gitem.locked .nm{color:var(--text-4)}
.gitem.locked{opacity:.6}
/* 中栏 */
.gcenter{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  border:var(--bw-1) solid var(--line-1);border-radius:var(--r-2);background:
  radial-gradient(circle at 50% 30%,rgba(194,146,69,.14),rgba(0,0,0,.4) 74%)}
.emblem{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative;
  border:var(--bw-2) solid var(--gold-2);background:radial-gradient(circle at 50% 34%,#3A2C1A,#120C08 76%);
  box-shadow:var(--shadow-gold)}
.emblem::after{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:1px dashed rgba(194,146,69,.4);animation:spin 22s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.emblem span{font-family:var(--font-display);font-size:44px;color:var(--gold-4);text-shadow:0 0 18px rgba(194,146,69,.5)}
.gname{font-family:var(--font-display);font-size:22px;letter-spacing:.3em;color:var(--gold-5)}
.gdesc{font-size:11.5px;color:var(--text-3);max-width:34ch;text-align:center;line-height:1.8}
.gcur{font-size:11px;color:var(--text-4);letter-spacing:.06em}
.gcur b{color:var(--text-1);font-weight:400}
/* 右栏 */
.gside{display:flex;flex-direction:column;padding-top:8px}
.gside h4{font-family:var(--font-display);font-size:13px;letter-spacing:.2em;color:var(--gold-4);margin-bottom:6px}
.gcost{margin-top:auto;padding-top:10px;border-top:var(--bw-1) solid var(--line-1)}
.gcost .kv dd{font-size:14px}
.gbtn{margin:12px 0 4px}
.showline{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:var(--r-2);
  border:var(--bw-1) solid var(--line-1);background:rgba(0,0,0,.22);font-size:11.5px;color:var(--text-3)}
</style>
</head>
<body>
<div class="stage"><div class="stage-inner">
  <div class="stage-bg stage-bg--blur"><img src="../assets/hero-bg.jpg"></div>
  <div class="stage-scrim"></div>

  <div class="layer layer--dialog center">
    <div class="panel panel--rivet grow">
      <div class="panel-head">
        <span class="panel-eyebrow">GROWTH · RANK / TITLE / SOUL</span>
        <h2 class="panel-title">军衔</h2>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="gbody">

        <!-- 左：全部军衔 -->
        <div class="glist scroll">
          <div class="gitem on"><span class="step">7</span><span class="nm">振威校尉</span></div>
          <div class="gitem"><span class="step">6</span><span class="nm">昭武都尉</span></div>
          <div class="gitem"><span class="step">5</span><span class="nm">怀远将军</span></div>
          <div class="gitem"><span class="step">4</span><span class="nm">忠武将军</span></div>
          <div class="gitem locked"><span class="step">8</span><span class="nm">云麾将军</span></div>
          <div class="gitem locked"><span class="step">9</span><span class="nm">忠武都尉</span></div>
        </div>

        <!-- 中：徽记 + 名称 + 描述 -->
        <div class="gcenter">
          <div class="emblem"><span>威</span></div>
          <div class="gname">振威校尉</div>
          <p class="gdesc">沙场积功至七阶。授衔者可在皇城正门立旗，行会战中喊话全服可见。</p>
          <div class="gcur">当前军衔：<b>第 7 阶 · 振威校尉</b>（共 9 阶）</div>
        </div>

        <!-- 右：加成 + 消耗 + 按钮 -->
        <div class="gside">
          <h4>晋升加成</h4>
          <dl>
            <div class="kv"><dt>物理攻击</dt><dd class="up">+18</dd></div>
            <div class="kv"><dt>物理防御</dt><dd class="up">+12</dd></div>
            <div class="kv"><dt>生命上限</dt><dd class="up">+260</dd></div>
            <div class="kv"><dt>战斗力</dt><dd class="up">+420</dd></div>
          </dl>
          <div class="gcost">
            <div class="kv"><dt>晋升消耗</dt><dd>8,000 绑定元宝</dd></div>
            <div class="kv"><dt>当前余额</dt><dd>12,480</dd></div>
            <button class="btn btn--primary gbtn btn--block" style="height:46px;font-size:16px">晋 升</button>
            <div class="showline">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="width:15px;height:15px;color:var(--gold-3)"><path d="M5 12l5 5L20 7"/></svg>
              头顶将显示【振威校尉】红字，全服可见
            </div>
          </div>
        </div>

      </div>
      <div class="panel-foot"><span>称号 / 战魂共用本版式：中栏换名牌或战魂动画，右栏换消耗</span><span>战魂多一个「外显」开关</span></div>
    </div>
  </div>

</div></div>
<script src="../stage.js"></script>
</body>
</html>
