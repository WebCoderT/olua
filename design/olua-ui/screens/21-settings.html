<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>21 · 设置 · Olua UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<style>
/* ── 设置 460×220：账号相关动作（选择角色 / 退出登录）两行 ── */
.settings{position:relative;width:460px;height:220px}
.settings .srow{display:flex;align-items:center;gap:12px;width:400px;height:52px;margin:0 auto;padding:0 16px;
  border-radius:var(--r-2);border:var(--bw-1) solid var(--line-2);background:rgba(0,0,0,.22)}
.settings .srow + .srow{margin-top:14px}
.settings .srow .info{flex:1;min-width:0}
.settings .srow .name{font-size:14px;color:var(--text-1);letter-spacing:.04em}
.settings .srow .desc{font-size:11px;color:var(--text-3);margin-top:3px;letter-spacing:.02em}
.settings .srow .btn{min-width:100px;height:32px;font-size:12px;flex:0 0 auto}
</style>
</head>
<body>
<div class="stage"><div class="stage-inner">
  <div class="stage-bg stage-bg--blur"><img src="../assets/hero-bg.jpg"></div>
  <div class="stage-scrim"></div>

  <div class="layer layer--dialog center">
    <div class="panel panel--rivet settings">
      <div class="panel-head">
        <span class="panel-eyebrow">SETTING</span>
        <h2 class="panel-title">设置</h2>
        <button class="panel-close" aria-label="关闭">×</button>
      </div>
      <div class="panel-body">

        <div class="srow">
          <div class="info">
            <div class="name">选择角色</div>
            <div class="desc">返回选角界面，当前进度已自动保存</div>
          </div>
          <button class="btn btn--gold">选择角色</button>
        </div>

        <div class="srow">
          <div class="info">
            <div class="name">退出登录</div>
            <div class="desc">退出当前账号，返回登录页</div>
          </div>
          <button class="btn btn--danger">退出登录</button>
        </div>

      </div>
    </div>
  </div>

</div></div>
<script src="../stage.js"></script>
</body>
</html>
