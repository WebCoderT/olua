# ==============================================================================
#  游戏客户端（Cocos Web 构建产物）静态托管 + 接口同源反代
#
#  与管理端 admin/nginx.conf 是**两份独立**的配置，各自挂一个端口：
#    管理端 80（existing）、游戏 8080（见 docker-compose.yml 的 OLUA_GAME_PORT）
#  为什么要分开而不是塞进同一个端口的子路径：Cocos 构建产物里的资源路径是相对
#  根目录的（/assets/...），放在子路径下会大面积 404，除非改构建时的资源服务器
#  地址；独立端口零成本且两边互不影响。
#
#  两处与 docker-compose.yml 耦合，改一边要两边一起改（tools/audit-deploy.cjs 会验）：
#    1. `server` 是 compose 里的服务名（下面用变量 + Docker 内置 DNS 解析）
#    2. `/api/` 要和服务端的 API_PREFIX 一致
# ==============================================================================

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;

  # resources 下有十几万个小文件（角色帧序列 / 配置 json），每次请求都 stat 一遍
  # 在机械盘上很明显；缓存文件的元数据，命中就不再 stat。
  open_file_cache max=200000 inactive=60s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 1;
  open_file_cache_errors on;

  # 图片本身压不动（PNG/JPG 已压缩），只对 js / json / xml 这类文本有效
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml;
  gzip_min_length 1024;

  # index.html 不缓存：发版后浏览器必须拉新页面，否则它引用的旧资源可能已经不存在
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # 构建没开 md5Cache → 文件名不带内容哈希，内容变了名字不变。
  # 所以这里**不能**用 immutable 长缓存，否则发版后玩家端还是旧资源。
  location /assets/ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # Cocos 游戏不是单页路由应用，**故意不做** `try_files $uri /index.html` ——
  # 缺资源时应该如实返回 404 让 Cocos 明确报错；回落成 index.html 会把它变成
  # 一段 HTML 喂给资源加载器，错误变得极难排查。
  #
  # 但 `$uri/` 这一项不能省：请求 `/` 时 `$uri` 是根**目录**而不是文件，少了它
  # nginx 会直接落到 =404（玩家打开 http://host:8080/ 看到 404，手打 /index.html
  # 却又正常），得由这项目录分支把请求交回上面的 index index.html 处理。
  # 注意这跟 SPA 回落是两回事：普通缺失文件依然走到 =404。
  location / {
    try_files $uri $uri/ =404;
  }

  location /api/ {
    # 和管理端同样的写法：变量 + Docker 内置 DNS。写死上游的话，server 容器还没就绪时
    # nginx 会 `host not found in upstream` 直接起不来（depends_on 不保证名字已可解析）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $olua_api http://server:3100;
    proxy_pass $olua_api;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 服务端登录限流按 IP 计数，必须拿到真实来源 IP（服务端已开 TRUST_PROXY）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
