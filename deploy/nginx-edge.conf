# ==============================================================================
#  边缘入口（TLS 终结，#742）：:80 只做 ACME 校验与 301，:443 持证书整站反代到 admin:80
#
#  **这是 envsubst 模板**（与 admin/nginx.conf.template 同一个机制）：挂到容器的
#  /etc/nginx/templates/default.conf.template，启动时由镜像里的 20-envsubst-on-templates.sh
#  把 ${OLUA_*} 换成容器环境变量。域名因此仍然只有 deploy.env 一个来源。
#
#  为什么单独一层，而不是让 admin 容器自己 listen 443：
#    1. 三站分流（官网 / 管理端 / 游戏）已经在 admin 的模板里了。边缘要做的事只是
#       「把同一个 Host 原封不动转进去」，所以这里**只有一段 location**。反过来说，
#       让 admin 自己上 TLS 就得把 80 跳转与 443 站点各写一份三站 server 块 ——
#       同一套路由两份配置，改一处忘一处只在线上才看得出来。
#    2. 证书续期只影响这一层：reload 打的是边缘容器，管理端与游戏端不用重启。
#
#  两处与 docker-compose.yml 耦合，改一边要两边一起改（tools/audit-deploy.cjs 会验）：
#    1. 上游服务名 `admin` 与端口 `80`（compose 里的服务名）
#    2. 证书路径 `/etc/letsencrypt/live/olua/` 必须与 certbot 容器的 `--cert-name olua` 一致
# ==============================================================================

# WebSocket 升级的映射：边缘这一跳必须原样把 Upgrade / Connection 传下去，
# 少了它实时通道是「能登录、连不上」（跨进程之后这条链路是 浏览器 → 边缘 → admin → game）。
map $http_upgrade $olua_conn_upgrade {
  default upgrade;
  ''      close;
}

# ==============================================================================
#  :80 —— 只放行 ACME 校验，其余一律 301 到 https
#
#  http-01 校验**必须**走明文 80（Let's Encrypt 不会跟着 301 走），所以这个块不能
#  简化成一句 `return 301`：那样签证书那一步会一直失败，而且报错是「校验文件 404」。
#
#  用 301 而不是 302：浏览器会记住，第二次访问少一次往返。代价是「回滚到 http」
#  在浏览器侧不可逆（缓存里的 301 会一直跳），所以回滚要换域名或清缓存 —— 写进
#  docs/deploy.md 的回滚一节了。
# ==============================================================================
server {
  listen 80 default_server;
  server_name ${OLUA_SITE_DOMAINS} ${OLUA_ADMIN_DOMAIN} ${OLUA_GAME_DOMAIN} _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ==============================================================================
#  :443 —— 一张证书覆盖四个域名（yimw.cn / www / admin / game），整站反代到 admin:80
#
#  为什么不按站点拆成三段：证书是同一张（四个 SAN），而三站分流在 admin 里已经由
#  server_name 做完了。这里再拆一次只会把「谁是管理端」这件事写两遍。
#
#  未匹配的 Host（直接用 IP 打 https）落到本块：证书名对不上，浏览器会警告，但
#  内容仍是管理端 —— 与 :80 的 default_server 取向一致（原来的部署里 IP 直访进管理端）。
# ==============================================================================
server {
  listen 443 ssl default_server;
  http2 on;
  server_name ${OLUA_SITE_DOMAINS} ${OLUA_ADMIN_DOMAIN} ${OLUA_GAME_DOMAIN} _;

  # 证书目录由 certbot 容器写、边缘只读挂载（见 docker-compose.yml 的 olua-letsencrypt）。
  # `--cert-name olua` 是固定名字：换域名时证书内容变、目录不变，这里的路径就不用跟着改。
  ssl_certificate     /etc/letsencrypt/live/olua/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/olua/privkey.pem;

  # 只留 TLS1.2 / 1.3：1.0-1.1 已被主流浏览器判不安全，留着只是让扫描器报红。
  ssl_protocols TLSv1.2 TLSv1.3;
  # 会话复用：握手是 TLS 的主要开销，10m 够一个中等规模的站点用
  ssl_session_cache shared:olua_tls:10m;
  ssl_session_timeout 1d;
  # 由客户端选密码套件：服务端的偏好表在 TLS1.3 里基本不起作用，
  # 开着反而会让新套件排在旧套件后面
  ssl_prefer_server_ciphers off;

  # 用「变量 + Docker 内置 DNS」而不是把上游写成字面量：写死的话 admin 还没就绪时
  # nginx 会 `host not found in upstream` 直接起不来（depends_on 只保证启动顺序，
  # 不保证名字已经可解析）—— 与 admin/game 两份配置同一个取向。
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $olua_admin http://admin:80;

  location / {
    proxy_pass $olua_admin;
    proxy_http_version 1.1;

    # Host 原样透传：admin 的 nginx 靠它做三站分流（官网 / 管理端 / 游戏）
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 服务端按 IP 做登录限流，必须拿到真实来源 IP（admin 会再补一次，两跳都要有）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 边缘是 TLS 终结的那一跳，这里如实写 https。
    # 注意：admin / game 的内层配置会把这一头覆写成 `$scheme`（内网是 http），
    # 服务端目前不读它（`grep X-Forwarded-Proto server/src` 是空的），所以不影响行为；
    # 将来服务端要用它（比如给 cookie 加 Secure）时，得让内层改成透传而不是覆写。
    proxy_set_header X-Forwarded-Proto https;

    # 实时通道（/api/realtime*，WebSocket）要过两跳，这两行不能少
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $olua_conn_upgrade;

    # WS 是长连接：默认 60s 没数据就被 nginx 掐断（客户端有心跳，但别把余量压到 0）。
    # 游戏素材的整段下载也走这里，读超时同样要放宽。
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 配置快照导入（#1266）：管理端上传 config-sync.sql（4MB+）要穿过这一跳。
    # 默认 1MB 上限会在边缘直接 413 —— 与 admin 内层的 /api/ 同值，两层一起放。
    client_max_body_size 64m;
  }
}
